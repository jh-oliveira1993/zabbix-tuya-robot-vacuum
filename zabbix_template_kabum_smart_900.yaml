              name: 'Vacuum Cleaner - Main Brush Projected to Expire Within 3 Days'
              priority: INFO
              description: 'Predictive maintenance alert: based on the current wear trend (7-day linear regression), the main roller brush is projected to reach 0 h of remaining life within 3 days. Schedule replacement proactively to avoid reduced cleaning performance and possible motor strain. Requires at least 7 days of historical data to function reliably.'
              dependencies:
