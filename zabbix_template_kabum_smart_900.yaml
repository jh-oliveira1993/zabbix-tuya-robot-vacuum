  triggers:
    - uuid: e1d7c6b5a4f3498c9d3e4f5a6b7c8d9e
      expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.status)="cleaning" and timeleft(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.battery,30m,15)>0 and timeleft(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.battery,30m,15)<1800'
      name: 'Vacuum Cleaner - Battery Predicted to Hit Critical Level Within 30 min'
      priority: WARNING
      description: 'While actively cleaning, the current battery discharge trend (30-minute window) indicates the battery will reach 15% within 30 minutes. The robot may not complete the session and could require manual intervention if it fails to auto-dock in time.'
      dependencies:
        - name: 'Vacuum Cleaner - Critical Battery'
          expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.battery)<15'
    - uuid: da77cab0cb754e8e98033f91c4aa37e7
      expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.status)="cleaning" and nodata(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.area,30m)=0 and change(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.area)=0'
      name: 'Vacuum Cleaner - Robot Stuck During Cleaning'
      priority: AVERAGE
      description: 'The robot has been in "cleaning" state for over 30 minutes without any change in the cleaned area, suggesting it may be stuck or obstructed.'
    - uuid: 22d51244b6604bb5991e08df99f31e9c
      expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.status)="charging" and last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.battery)<50 and now()-find(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.status,,"eq","charging")>3600'
      name: 'Vacuum Cleaner - Slow or Failed Charging Cycle'
      priority: WARNING
      description: 'The robot has been charging for over 1 hour but the battery remains below 50%, which may indicate a degraded battery cell or a dock contact issue.'
