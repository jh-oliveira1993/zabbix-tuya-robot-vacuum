zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 12078089fb0245aca72899e7b15149f5
      name: 'Global Accounts Templates'
  templates:
    - uuid: a3c4dbde4b1a4185bc03923a1050a9c6
      template: 'Template Tuya Vacuum KaBuM 900'
      name: 'Template Tuya Vacuum KaBuM 900'
      groups:
        - name: 'Global Accounts Templates'
      items:
        - uuid: c11e74de25aa4cfb841a1a9e8838a0f5
          name: 'Last Cleaning Area'
          type: DEPENDENT
          key: tuya.vacuum.area
          delay: '0'
          history: 180d
          units: m²
          description: 'The surface area covered during the most recent cleaning session. Useful to detect navigation failures if the area drops significantly below baseline.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''108'']'
          master_item:
            key: tuya.vacuum.raw
          triggers:
            - uuid: f2e8d7c6b5a4498dae4f5a6b7c8d9e0f
              expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.area)<min(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.area,30d)*0.7'
              name: 'Vacuum Cleaner - Session Area Abnormally Small (Possible Abandoned Session)'
              priority: WARNING
              description: 'The area covered in the most recent cleaning session is more than 30% below the smallest session recorded in the last 30 days. This comparison is zone-agnostic: it anchors on the smallest zone''s typical value, so any session — regardless of which floor was cleaned — that falls below this threshold indicates the robot likely stopped prematurely (stuck, low battery, navigation error). Requires at least 30 days of historical data.'
        - uuid: b361a6b0c2384a5696c21e64ff477d85
          name: 'Battery Level'
          type: DEPENDENT
          key: tuya.vacuum.battery
          delay: '0'
          history: 180d
          units: '%'
          description: 'Current battery state of charge (SoC). Crucial for monitoring battery degradation over time and alerting on failed charging cycles.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''106'']'
          master_item:
            key: tuya.vacuum.raw
          triggers:
            - uuid: d4d80ea47f524d7cb0f1a92e10e7b8b7
              expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.battery)<15'
              name: 'Vacuum Cleaner - Critical Battery'
              priority: AVERAGE
            - uuid: 299295c538f345818caab2f1c9c783f7
              expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.battery)<30'
              name: 'Vacuum Cleaner - Low Battery'
              priority: WARNING
              dependencies:
                - name: 'Vacuum Cleaner - Critical Battery'
                  expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.battery)<15'
        - uuid: 9a5840d24c034a0283f5c531d05fae37
          name: 'Cleaning Mode'
          type: DEPENDENT
          key: tuya.vacuum.cleaning_mode
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Active navigation algorithm or pathing mode (e.g., smart, zone, spot).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''136'']'
          master_item:
            key: tuya.vacuum.raw
        - uuid: 0b59b3fc02184e938f382a9a7b9854ad
          name: 'Error Code'
          type: DEPENDENT
          key: tuya.vacuum.error_code
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Hardware or software fault code reported by the MCU. A value of "0" indicates nominal operation. Critical metric for incident generation.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''133'']'
          master_item:
            key: tuya.vacuum.raw
          triggers:
            - uuid: 8c82330276e44be586bf15268855344d
              expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.error_code)<>"0"'
              name: 'Vacuum Cleaner - Hardware/Software Fault Detected'
              event_name: 'Vacuum fault: {ITEM.LASTVALUE}'
              priority: HIGH
              description: 'The robot reported a non-zero error code, indicating a hardware or software fault. Check the device for physical obstructions or component failure.'
        - uuid: a8b0c8d9e2a14b308f237146b9a8cf24
          name: 'HEPA Filter Life'
          type: DEPENDENT
          key: tuya.vacuum.filter_life
          delay: '0'
          history: 180d
          units: h
          description: 'Estimated remaining lifespan of the HEPA filter. Preprocessed from seconds to hours. Key metric for predictive maintenance (AIOps).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''116'']'
            - type: MULTIPLIER
              parameters:
                - '0.000277778'
          master_item:
            key: tuya.vacuum.raw
          triggers:
            - uuid: a7f3e2d1c4b5498e8f9a0b1c2d3e4f5a
              expression: 'timeleft(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.filter_life,7d,0)>0 and timeleft(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.filter_life,7d,0)<259200'
              name: 'Vacuum Cleaner - HEPA Filter Projected to Expire Within 3 Days'
              priority: INFO
              description: 'Predictive maintenance alert: based on the current consumption trend (7-day linear regression), the HEPA filter is projected to reach 0 h of remaining life within 3 days. Schedule replacement proactively to avoid suction degradation. Requires at least 7 days of historical data to function reliably.'
              dependencies:
                - name: 'Vacuum Cleaner - HEPA Filter Replacement Required'
                  expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.filter_life)<10'
            - uuid: 26d8774a7bc942f18a81500c042be546
              expression: 'last(/Template Tuya Vacuum KaBuM 900/tuya.vacuum.filter_life)<10'
              name: 'Vacuum Cleaner - HEPA Filter Replacement Required'
              priority: WARNING
              description: 'The HEPA filter has less than 10 hours of life remaining. Replace or clean the filter to maintain suction efficiency and air quality.'
        - uuid: e3d74cbb555848bb9ecae098d5ea4b53
